<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mars Rover Photo Explorer</title>
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="container">
  <header>
    <h1>mars Rover Photo Explorer</h1>
  </header>
 
  <form id="marsRoversForm">
    <h2>select a rover and picture date:</h2>
 
    <div>
      <label>
        <input type="radio" name="rover" value="curiosity" required>
        Curiosity
      </label>
 
      <label>
        <input type="radio" name="rover" value="opportunity" required>
        Opportunity
      </label>
 
      <label>
        <input type="radio" name="rover" value="spirit" required>
        Spirit
      </label>
    </div>
 
    <div>
      <label for="picturedate" class="formlabel">picture Date:</label>
      <input type="date" name="picturedate" id="picturedate" required>
    </div>
 
    <div id="buttons">
      <button type="button" onclick="searchPhotos()">search</button>
      <button type="reset">clear</button>
    </div>
 
    <div id="photos"></div>
 
    <div id="gallery"></div>
  </form>
 
  <script>
    async function searchPhotos() {
      const form = document.getElementById("marsRoversForm");
      if (!form.reportValidity()) return;
 
      const rover = document.querySelector('input[name="rover"]:checked').value;
      const pictureDate = document.getElementById("picturedate").value;
      const apiKey = "klPNVKxX7LPt1NKjTDTr52PJfARUVGGSHZO83Ddz";
      const url = `https://api.nasa.gov/mars-photos/api/v1/rovers/${rover}/photos?earth_date=${pictureDate}&api_key=${apiKey}`;
 
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to fetch photos: ${response.statusText}`);
        }
        const data = await response.json();
 
        const photos = data.photos.slice(0, 25);
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";
 
        if (photos.length === 0) {
          document.getElementById("photos").textContent = "no pictures found for this date.";
        } else {
          photos.forEach((photo, index) => {
            const image = document.createElement("img");
            image.src = photo.img_src;
            image.alt = `Photo ${index + 1}`;
            image.title = photo.camera.full_name;
            gallery.appendChild(image);
          });
 
          document.getElementById("photos").textContent = `${photos.length} pictures found.`;
        }
      } catch (error) {
        console.error("cannot load images", error);
        document.getElementById("photos").textContent = "Cannot load images";
      }
    }
  </script>
</body>
</html>
